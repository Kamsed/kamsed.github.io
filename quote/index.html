<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../icon.ico">
  <title>寻章摘句</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="../theme.css">
  <script src="../theme.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
      line-height: 1.9;
      padding: 4rem 1.5rem 6rem;
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 3rem;
      text-transform: uppercase;
    }
    .quote-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.8rem 1.6rem;
      margin-bottom: 1.2rem;
      transition: box-shadow 0.2s ease;
    }
    .quote-card:hover {
      box-shadow: 0 4px 20px var(--hover-shadow);
    }
    .quote-text {
      font-size: 1.05rem;
      margin-bottom: 0.8rem;
    }
    .quote-author {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: right;
    }
    .quote-author::before { content: "—— "; }
    .empty, .error {
      text-align: center;
      color: var(--muted);
      padding: 3rem 0;
      font-size: 0.95rem;
    }

    /* 主题开关：与首页同一颗胶囊 */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 7px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }
    .theme-toggle:hover { color: var(--fg); border-color: var(--muted); }
    .theme-toggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

    /* 返回首页：跟主题开关对称放在左上角 */
    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 7px 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      text-decoration: none;
    }
    .back-link:hover { color: var(--fg); border-color: var(--muted); }
    .back-link:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

    /* 只有一条摘抄时：不套卡片，居中当一句题字 */
    body.solo h1 { margin-bottom: 1.6rem; }

    .quote-solo {
      text-align: center;
      padding: 11vh 0 0;
      animation: solo-in .8s ease both;
    }
    .quote-solo blockquote {
      font-size: clamp(1.25rem, 4.2vw, 1.9rem);
      line-height: 2.1;
      letter-spacing: .05em;
    }
    .quote-solo figcaption {
      margin-top: 1.8rem;
      font-size: .85rem;
      color: var(--muted);
    }
    .quote-solo figcaption::before { content: "—— "; }

    @keyframes solo-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .quote-card { transition: none; }
      .quote-solo { animation: none; }
    }
  </style>
</head>
<body>
  <a class="back-link" href="../index.html" aria-label="回到首页">←</a>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换颜色主题">自动</button>

  <h1>摘抄</h1>
  <div id="app"></div>

  <script>
    const app = document.getElementById('app');

    fetch('./quote.json')
      .then(r => {
        if (!r.ok) throw new Error('fetch failed');
        return r.json();
      })
      .then(quotes => {
        if (!quotes.length) {
          app.innerHTML = '<p class="empty">还没有摘抄。</p>';
          return;
        }
        // 只有一条时不套卡片，居中当一句题字
        if (quotes.length === 1) {
          const q = quotes[0];
          document.body.classList.add('solo');
          app.innerHTML = `
            <figure class="quote-solo">
              <blockquote>${escapeHTML(q.text)}</blockquote>
              <figcaption>${escapeHTML(q.author || '')}</figcaption>
            </figure>
          `;
          return;
        }
        app.innerHTML = quotes.map(q => `
          <figure class="quote-card">
            <blockquote class="quote-text">${escapeHTML(q.text)}</blockquote>
            <figcaption class="quote-author">${escapeHTML(q.author || '')}</figcaption>
          </figure>
        `).join('');
      })
      .catch(() => {
        app.innerHTML = '<p class="error">摘抄加载失败，请稍后再试。</p>';
      });

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
