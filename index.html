<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="icon.ico">
<title>kamsed</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">

<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>

<style>
  * { box-sizing: border-box; }

  /* 光标拖尾层：铺满视口，只负责显示，不接管任何指针事件 */
  #cursor-trail {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
    pointer-events: none;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 400 clamp(20px, 5vw, 30px)/1.5 -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    animation: fade .8s ease both;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 散字文字 ---------- */

  .scatter {
    margin: 0;
    display: inline-flex;
    align-items: baseline;
    gap: .18em;                 /* 字间距，与参考图一致留有呼吸感 */
    letter-spacing: .04em;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;   /* iOS 长按不弹「拷贝/查询」，免得盖住解锁入口 */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    padding: .25em .5em;        /* 放大点击热区，不改变视觉位置 */
    margin: -.25em -.5em;
    border-radius: 10px;
  }

  .scatter:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 4px;
  }

  .scatter .ch {
    display: inline-block;
    transform-origin: 50% 60%;
    will-change: transform, opacity, filter;
    backface-visibility: hidden;
  }

  /* 开始散开后，文字不再可点，避免连点打断 */
  .scatter.is-busy { cursor: default; pointer-events: none; }

  /* 两句文案叠在同一格，互换时不产生位移 */
  .stage {
    display: grid;
    place-items: center;
  }

  .stage > * { grid-area: 1 / 1; }

  /* 第二幕那句默认不可见，也不吃事件 */
  .line-b {
    visibility: hidden;
    pointer-events: none;
    cursor: default;
    gap: 0;                 /* 颜文字要连成一体，去掉字距 */
    letter-spacing: 0;
  }

  .line-b.is-on { visibility: visible; }

  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 7px 16px;
    font: inherit;
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: color .2s, border-color .2s, background-color .35s ease;
  }

  .theme-toggle:hover { color: var(--fg); border-color: var(--muted); }
  .theme-toggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .guide-link {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 7px 16px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    text-decoration: none;
    transition: color .2s, border-color .2s, background-color .35s ease;
  }

  .guide-link:hover { color: var(--fg); border-color: var(--muted); }
  .guide-link:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* 入口默认藏着：长按文字解锁后才挂上来 */
  .guide-link[hidden] { display: none; }

  .guide-link.is-revealed { animation: reveal .7s cubic-bezier(.2,.8,.25,1) both; }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(-8px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  /* 凌晨（0–5 点）：光标拖尾换冷色，配合夜里那句台词 */
  html[data-night="1"] { --trail-rgb: 120, 156, 255; }

  @media (prefers-reduced-motion: reduce) {
    body { transition: none; }
    main { animation: none; }
    .guide-link.is-revealed { animation: none; }
    #cursor-trail { display: none; }
  }
</style>
</head>
<body>

<canvas id="cursor-trail" aria-hidden="true"></canvas>

<a class="guide-link" id="guide" href="quote/index.html" aria-label="前往摘抄页面" hidden>摘抄</a>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换颜色主题">自动</button>

<main>
  <div class="stage" id="stage">
    <p class="scatter" id="line-a" role="button" tabindex="0"
       aria-label="点击开始：文字散开，换一句，再聚回来">
      <span class="ch">这</span><span class="ch">里</span><span class="ch">什</span><span class="ch">么</span><span class="ch">都</span><span class="ch">没</span><span class="ch">有</span>
    </p>
    <p class="scatter line-b" id="line-b" aria-hidden="true">
      <span class="ch">╮</span><span class="ch">（</span><span class="ch">╯</span><span class="ch">＿</span><span class="ch">╰</span><span class="ch">）</span><span class="ch">╭</span>
    </p>
  </div>
</main>

<script>
  /* ------------------------------------------------------------------
     摘抄入口：藏在文字里
     - 入口默认不渲染，长按文字 900ms 解锁
     - 长按后抬手那一次 click 会被吞掉，不会顺带触发散字
     - 解锁状态写 localStorage，此后一直显示
     - 键盘兜底：任意位置连续敲 quote 也能解锁
  ------------------------------------------------------------------ */
  (function () {
    var HOLD = 900;
    var KEY = 'quote-unlocked';

    var word = document.getElementById('line-a');
    var link = document.getElementById('guide');
    if (!word || !link) return;

    var unlocked = false;
    try { unlocked = localStorage.getItem(KEY) === '1'; } catch (e) {}

    function reveal() {
      if (!link.hidden) return;
      link.hidden = false;
      link.classList.add('is-revealed');
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
      /* 文字轻微一沉，给个「按到了」的反馈 */
      try {
        word.animate(
          [{ transform: 'none' }, { transform: 'scale(.985)' }, { transform: 'none' }],
          { duration: 280, easing: 'ease-out' }
        );
      } catch (e) {}
    }

    if (unlocked) link.hidden = false;

    var timer = 0, holding = false, armed = false;

    function stopHold() {
      holding = false;
      window.clearTimeout(timer);
    }

    word.addEventListener('pointerdown', function () {
      armed = false;              /* 清掉上一次可能残留的吞点击标记 */
      holding = true;
      window.clearTimeout(timer);
      timer = window.setTimeout(function () {
        if (!holding) return;
        holding = false;
        armed = true;             /* 抬手产生的那次 click 要吞掉 */
        reveal();
      }, HOLD);
    });

    word.addEventListener('pointerup', stopHold);
    word.addEventListener('pointercancel', stopHold);
    word.addEventListener('pointerleave', stopHold);
    window.addEventListener('blur', stopHold);

    /* 捕获阶段拦截，散字脚本的 click 收不到 */
    word.addEventListener('click', function (e) {
      if (!armed) return;
      armed = false;
      e.stopImmediatePropagation();
      e.preventDefault();
    }, true);

    /* 键盘兜底 */
    var buf = '';
    document.addEventListener('keydown', function (e) {
      if (!e.key || e.key.length !== 1) return;
      buf = (buf + e.key.toLowerCase()).slice(-5);
      if (buf === 'quote') reveal();
    });
  })();
</script>

<script>
  /* ------------------------------------------------------------------
     两幕散字动画 + 来访记忆
     点击后依次：
     1) 第一句散开：每字随机方向、距离、旋转、时长，位移同时淡出并模糊
     2) 随机静默后，原位置淡入第二句（一张颜文字）
     3) 停留 2 秒，再淡出
     4) 第一句从第 1 步的散开位置聚拢回原位
     台词与颜文字按来访情况成对切换（见 SCENES）：
     首次 / 熟客 / 久别 / 凌晨，各一组
     - 记下每字散开的终态，聚拢从同一状态起步，是「收回来」而不是重新出现
     - 逐字用 Web Animations API 控制，整个流程可随时 clear 打断
     - prefers-reduced-motion 时只做淡入淡出，不做位移
     - 流程进行中忽略点击，避免状态错乱
  ------------------------------------------------------------------ */
  (function () {
    var a = document.getElementById('line-a');
    var b = document.getElementById('line-b');
    if (!a || !b) return;

    /* ---- 台词表：一句话配一张脸，按来访情况选一组 ---- */
    var SCENES = {
      first: { line: '这里什么都没有', face: '╮（╯＿╰）╭' },
      again: { line: '又来了',        face: '(￣▽￣)"' },
      long:  { line: '好久不见',      face: 'o(￣▽￣)ｄ' },
      night: { line: '该睡了',        face: '(_　_)。゜zｚＺ' }
    };

    /* ---- 来访记录：同一天只记一次，隔 14 天算久别 ---- */
    function stamp(ts) {
      var d = new Date(ts);
      return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    }

    var KEY = 'visits';
    var rec = { count: 0, last: 0 };
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) rec = JSON.parse(raw) || rec;
    } catch (e) {}

    var now = Date.now();
    var gapDays = rec.last ? Math.floor((now - rec.last) / 86400000) : -1;
    var sameDay = rec.last ? stamp(rec.last) === stamp(now) : false;
    var count = sameDay ? (rec.count || 1) : (rec.count || 0) + 1;
    try {
      localStorage.setItem(KEY, JSON.stringify({ count: count, last: now }));
    } catch (e) {}

    var hour = new Date().getHours();

    /* 优先级：久别 > 首次 > 凌晨 > 又来了
       首次永远给站点原话，「该睡了」留给回头客 */
    function pickScene() {
      if (gapDays >= 14) return 'long';
      if (count <= 1) return 'first';
      if (hour >= 0 && hour < 5) return 'night';
      if (count >= 4) return 'again';
      return 'first';
    }

    var A = [], B = [];

    /* ---- 按场景重造逐字 span，返回该行的字符节点 ---- */
    function build(el, str) {
      var frag = document.createDocumentFragment();
      var cs = Array.from(str);
      for (var i = 0; i < cs.length; i++) {
        var s = document.createElement('span');
        s.className = 'ch';
        s.textContent = cs[i];
        frag.appendChild(s);
      }
      el.textContent = '';
      el.appendChild(frag);
      return Array.prototype.slice.call(el.querySelectorAll('.ch'));
    }

    var sceneKey = pickScene();
    var scene = SCENES[sceneKey];
    A = build(a, scene.line);
    B = build(b, scene.face);
    a.setAttribute('aria-label', scene.line + '，点击开始');

    /* 凌晨把拖尾换成冷色，跟选到哪一句无关 */
    if (hour >= 0 && hour < 5) document.documentElement.dataset.night = '1';

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    var busy = false;
    var timers = [];
    var acts = [];
    var out = [];             /* 每个字散开后的终态 { dx, dy, rot } */

    var HOLD = 2000;          /* 第二句停留时长（毫秒） */

    function rnd(x, y) { return x + Math.random() * (y - x); }
    function px(v) { return v.toFixed(1) + 'px'; }

    function later(ms, fn) { timers.push(window.setTimeout(fn, ms)); }

    function clearTimers() {
      for (var i = 0; i < timers.length; i++) window.clearTimeout(timers[i]);
      timers.length = 0;
    }

    function cancelAll() {
      for (var i = 0; i < acts.length; i++) {
        try { acts[i].cancel(); } catch (e) {}
      }
      acts.length = 0;
    }

    function play(el, frames, dur, delay, easing) {
      acts.push(el.animate(frames, {
        duration: dur,
        delay: delay,
        easing: easing,
        fill: 'both'
      }));
      return dur + delay;
    }

    function setBusy(v) {
      busy = v;
      a.classList.toggle('is-busy', v);
      a.setAttribute('aria-busy', v ? 'true' : 'false');
    }

    /* ---- 第一幕：散开消失 ---- */
    function scatterAway() {
      var longest = 0;
      out = [];
      for (var i = 0; i < A.length; i++) {
        var side = i < A.length / 2 ? -1 : 1;
        var reach = 40 + Math.abs(i - (A.length - 1) / 2) * 28;   /* 越靠边飞得越远 */
        var dx = side * rnd(reach * 0.8, reach * 1.8) + rnd(-12, 12);
        var dy = rnd(-90, 90);
        var rot = rnd(-28, 28) * side;
        out.push({ dx: dx, dy: dy, rot: rot });

        var dur = reduce.matches ? 300 : rnd(620, 880);
        var delay = reduce.matches ? 0 : rnd(0, 150);
        var frames = reduce.matches ? [
          { opacity: 1 }, { opacity: 0 }
        ] : [
          { offset: 0,    transform: 'none', opacity: 1, filter: 'blur(0px)' },
          { offset: 0.55, transform: 'translate3d(' + px(dx * .5) + ',' + px(dy * .5) +
                                    ',0) rotate(' + (rot * .5).toFixed(1) + 'deg)',
                          opacity: .5, filter: 'blur(.6px)' },
          { offset: 1,    transform: 'translate3d(' + px(dx) + ',' + px(dy) + ',0) rotate(' +
                                    rot.toFixed(1) + 'deg) scale(.86)', opacity: 0, filter: 'blur(3px)' }
        ];
        longest = Math.max(longest, play(A[i], frames, dur, delay,
          reduce.matches ? 'linear' : 'cubic-bezier(.22,.72,.28,1)'));
      }
      return longest;
    }

    /* ---- 第二幕：淡入「真的什么都没有」 ---- */
    function showB() {
      b.classList.add('is-on');
      var longest = 0;
      for (var i = 0; i < B.length; i++) {
        var dur = reduce.matches ? 220 : rnd(380, 520);
        var delay = reduce.matches ? 0 : i * 40;
        var frames = reduce.matches ? [
          { opacity: 0 }, { opacity: 1 }
        ] : [
          { transform: 'translate3d(0,' + px(rnd(6, 14)) + ',0) scale(.94)', opacity: 0, filter: 'blur(5px)' },
          { transform: 'none', opacity: 1, filter: 'blur(0px)' }
        ];
        longest = Math.max(longest, play(B[i], frames, dur, delay, 'cubic-bezier(.2,.8,.25,1)'));
      }
      return longest;
    }

    /* ---- 第二幕收尾：淡出 ---- */
    function hideB() {
      var longest = 0;
      for (var i = 0; i < B.length; i++) {
        var dur = reduce.matches ? 160 : rnd(220, 300);
        var delay = reduce.matches ? 0 : rnd(0, 60);
        var frames = reduce.matches ? [
          { opacity: 1 }, { opacity: 0 }
        ] : [
          { transform: 'none', opacity: 1, filter: 'blur(0px)' },
          { transform: 'translate3d(0,' + px(rnd(-10, -4)) + ',0)', opacity: 0, filter: 'blur(4px)' }
        ];
        longest = Math.max(longest, play(B[i], frames, dur, delay, 'cubic-bezier(.4,0,.7,.4)'));
      }
      return longest;
    }

    /* ---- 第三幕：从散开的位置聚拢回原位 ---- */
    function gatherA() {
      var longest = 0;
      for (var i = 0; i < A.length; i++) {
        var o = out[i] || { dx: 0, dy: 0, rot: 0 };
        var dur = reduce.matches ? 280 : rnd(480, 660);
        var delay = reduce.matches ? 0 : i * 30;
        var frames = reduce.matches ? [
          { opacity: 0 }, { opacity: 1 }
        ] : [
          { transform: 'translate3d(' + px(o.dx) + ',' + px(o.dy) + ',0) rotate(' +
                       o.rot.toFixed(1) + 'deg) scale(.86)', opacity: 0, filter: 'blur(3px)' },
          { transform: 'none', opacity: 1, filter: 'blur(0px)' }
        ];
        longest = Math.max(longest, play(A[i], frames, dur, delay, 'cubic-bezier(.16,.84,.3,1)'));
      }
      return longest;
    }

    function reset() {
      clearTimers();
      cancelAll();
      b.classList.remove('is-on');
      setBusy(false);
    }

    function run() {
      if (busy) return;
      reset();                 /* 从干净状态起跑 */
      setBusy(true);

      var t1 = scatterAway();

      /* 散开完 → 随机静默 → 第二句淡入 */
      later(t1 + (reduce.matches ? 200 : rnd(240, 500)), function () {
        var t2 = showB();

        /* 淡入完 → 停留 2 秒 → 淡出 */
        later(t2 + HOLD, function () {
          var t3 = hideB();

          /* 淡出完 → 原句从散开状态聚拢 */
          later(t3 + 80, function () {
            b.classList.remove('is-on');
            var t4 = gatherA();

            later(t4 + 60, function () {
              cancelAll();     /* 清掉 fill:both，回到无内联样式 */
              setBusy(false);
            });
          });
        });
      });
    }

    a.addEventListener('click', run);

    a.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        run();
      }
    });

    /* 切到后台再回来时把状态清干净，避免停在半路 */
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) reset();
    });

    window.__scatter = { run: run, reset: reset };
  })();
</script>

<script>
  /* ------------------------------------------------------------------
     光标拖尾（零依赖 Canvas 2D）
     - 记录指针轨迹点，逐段按"年龄"衰减透明度与线宽
     - 线宽随瞬时速度变化：快则细、慢则丰，形成丝带感
     - 沿路径散落光点，构成彗尾碎屑
     - 指针静止后不再追加新点，整条轨迹在 420ms 内淡出消失
     - 支持 prefers-reduced-motion、页面隐藏暂停、DPR 自适应
  ------------------------------------------------------------------ */
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var canvas = document.getElementById('cursor-trail');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var CONFIG = {
      life: 420,              /* 轨迹寿命（毫秒） */
      maxPoints: 64,          /* 轨迹点上限 */
      minStep: 2.5,           /* 相邻点最小间距，抑制抖动 */
      jump: 120,              /* 超过该间距视为断点，不连线 */
      widthMax: 5.4,          /* 最慢时的线宽 */
      widthMin: 1.5,          /* 最快时的线宽 */
      speedRef: 1500,         /* 线宽归一化的速度基准（px/s） */
      alpha: 0.80,            /* 轨迹峰值透明度 */
      glow: true,             /* 外层辉光 */
      sparkEvery: 13,         /* 每移动多少像素散落一枚光点 */
      sparkMax: 90,
      sparkLife: [280, 620],
      sparkSize: [0.8, 1.9],
      sparkAlpha: 0.55
    };

    var rgb = '16, 185, 129';
    var dark = false;

    var pts = [];            /* { x, y, t, v } */
    var sparks = [];         /* { x, y, vx, vy, age, life, r } */
    var w = 0, h = 0, dpr = 1;
    var running = false, rafId = 0, prevTime = 0, resizeRaf = 0;
    var started = false, lastX = 0, lastY = 0, lastT = 0, sparkAcc = 0;

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function readTheme() {
      var root = getComputedStyle(document.documentElement);
      var v = root.getPropertyValue('--trail-rgb').trim();
      if (v) rgb = v;
      var cs = (root.colorScheme || '').toLowerCase();
      dark = cs.indexOf('dark') !== -1;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      pts.length = 0;
      sparks.length = 0;
      started = false;
    }

    /* ---------- 轨迹与碎屑 ---------- */

    function spawnSpark(x, y, v, ux, uy) {
      if (sparks.length >= CONFIG.sparkMax) sparks.shift();
      var side = Math.random() < 0.5 ? -1 : 1;
      var off = rnd(2, 12) * side;
      var sp = rnd(6, 26) * (1 + Math.min(v, 2200) / 3000);
      sparks.push({
        x: x - uy * off,
        y: y + ux * off,
        vx: -uy * side * sp + ux * rnd(-12, 12),
        vy: ux * side * sp + uy * rnd(-12, 12),
        age: 0,
        life: rnd(CONFIG.sparkLife[0], CONFIG.sparkLife[1]),
        r: rnd(CONFIG.sparkSize[0], CONFIG.sparkSize[1]) * (1 + Math.min(v, 1800) / 2400)
      });
    }

    function onMove(e) {
      var t = e.timeStamp || performance.now();
      var x = e.clientX, y = e.clientY;

      if (!started) {
        started = true;
        lastX = x; lastY = y; lastT = t;
        return;
      }

      var dx = x - lastX, dy = y - lastY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONFIG.minStep) return;

      var dt = Math.max(t - lastT, 8) / 1000;
      var v = Math.min(dist / dt, 4000);

      pts.push({ x: x, y: y, t: t, v: v });
      if (pts.length > CONFIG.maxPoints) pts.shift();

      if (dist < CONFIG.jump) {
        sparkAcc += dist;
        while (sparkAcc >= CONFIG.sparkEvery) {
          sparkAcc -= CONFIG.sparkEvery;
          spawnSpark(x, y, v, dx / dist, dy / dist);
        }
      } else {
        sparkAcc = 0;
      }

      lastX = x; lastY = y; lastT = t;
      ensureLoop();
    }

    function updateSparks(dt) {
      var damp = Math.pow(0.12, dt);
      for (var i = sparks.length - 1; i >= 0; i--) {
        var s = sparks[i];
        s.age += dt * 1000;
        if (s.age >= s.life) { sparks.splice(i, 1); continue; }
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vx *= damp;
        s.vy *= damp;
      }
    }

    function prune(now) {
      var cut = now - CONFIG.life - 60;
      while (pts.length && pts[0].t < cut) pts.shift();
    }

    /* ---------- 绘制 ---------- */

    function strokeLayer(now, glow) {
      var n = pts.length;
      if (n < 2) return;

      /* 只有两个点时补一段直线，避免整条轨迹不出现 */
      if (n === 2) {
        var q0 = pts[0], q1 = pts[1];
        if (Math.abs(q1.x - q0.x) > CONFIG.jump || Math.abs(q1.y - q0.y) > CONFIG.jump) return;
        var age2 = (now - q0.t) / CONFIG.life;
        if (age2 < 0 || age2 > 1) return;
        var k2 = Math.pow(1 - age2, 1.6);
        ctx.beginPath();
        ctx.moveTo(q0.x, q0.y);
        ctx.lineTo(q1.x, q1.y);
        setStroke(k2, q0.v, glow);
        ctx.stroke();
        return;
      }

      for (var i = 1; i < n - 1; i++) {
        var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
        if (Math.abs(p1.x - p0.x) > CONFIG.jump || Math.abs(p1.y - p0.y) > CONFIG.jump) continue;
        if (Math.abs(p2.x - p1.x) > CONFIG.jump || Math.abs(p2.y - p1.y) > CONFIG.jump) continue;

        var age = (now - p1.t) / CONFIG.life;
        if (age < 0 || age > 1) continue;

        var k = Math.pow(1 - age, 1.6);
        if (k < 0.02) continue;

        ctx.beginPath();
        ctx.moveTo((p0.x + p1.x) / 2, (p0.y + p1.y) / 2);
        ctx.quadraticCurveTo(p1.x, p1.y, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
        setStroke(k, p1.v, glow);
        ctx.stroke();
      }
    }

    function setStroke(k, v, glow) {
      var sp = Math.min(1, v / CONFIG.speedRef);
      var base = CONFIG.widthMax - (CONFIG.widthMax - CONFIG.widthMin) * sp;
      var wd = base * k;
      var a = CONFIG.alpha * k;
      if (glow) { wd *= 4.6; a *= 0.15; }
      ctx.lineWidth = Math.max(wd, 0.2);
      ctx.strokeStyle = 'rgba(' + rgb + ',' + a.toFixed(3) + ')';
    }

    function drawHead(now) {
      if (!pts.length) return;
      var p = pts[pts.length - 1];
      var age = (now - p.t) / CONFIG.life;
      if (age < 0 || age > 1) return;
      var k = Math.pow(1 - age, 1.3);
      var sp = Math.min(1, p.v / CONFIG.speedRef);
      var r = (CONFIG.widthMax - (CONFIG.widthMax - CONFIG.widthMin) * sp) * 0.55 * k;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + rgb + ',' + (CONFIG.alpha * k).toFixed(3) + ')';
      ctx.arc(p.x, p.y, Math.max(r, 0.5), 0, 6.2832);
      ctx.fill();
    }

    function drawSparks() {
      for (var i = 0; i < sparks.length; i++) {
        var s = sparks[i];
        var k = 1 - s.age / s.life;
        var a = CONFIG.sparkAlpha * k * k;
        if (a < 0.004) continue;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + rgb + ',' + a.toFixed(3) + ')';
        ctx.arc(s.x, s.y, Math.max(s.r * k, 0.3), 0, 6.2832);
        ctx.fill();
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, w, h);
      if (!pts.length && !sparks.length) return;

      ctx.globalCompositeOperation = dark ? 'lighter' : 'multiply';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (CONFIG.glow) strokeLayer(now, true);
      strokeLayer(now, false);
      drawHead(now);
      drawSparks();

      ctx.globalCompositeOperation = 'source-over';
    }

    /* ---------- 主循环 ---------- */

    function frame(ts) {
      if (!running) return;
      var dt = Math.min((ts - prevTime) / 1000, 0.05);
      prevTime = ts;
      updateSparks(dt);
      prune(ts);
      draw(ts);
      if (pts.length || sparks.length) {
        rafId = requestAnimationFrame(frame);
      } else {
        running = false;
        rafId = 0;
      }
    }

    function ensureLoop() {
      if (running) return;
      running = true;
      prevTime = performance.now();
      rafId = requestAnimationFrame(frame);
    }

    /* ---------- 事件 ---------- */

    window.addEventListener('pointermove', onMove, { passive: true });

    window.addEventListener('pointerdown', function (e) {
      started = false;
      onMove(e);
      ensureLoop();
    }, { passive: true });

    window.addEventListener('resize', function () {
      if (resizeRaf) return;
      resizeRaf = requestAnimationFrame(function () {
        resizeRaf = 0;
        resize();
      });
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        running = false;
        cancelAnimationFrame(rafId);
        rafId = 0;
        pts.length = 0;
        sparks.length = 0;
        started = false;
      } else {
        ensureLoop();
      }
    });

    if (window.MutationObserver) {
      new MutationObserver(readTheme).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
    }
    var scheme = window.matchMedia('(prefers-color-scheme: dark)');
    if (scheme.addEventListener) scheme.addEventListener('change', readTheme);

    /* ---------- 启动 ---------- */

    resize();
    readTheme();

    window.__cursorTrail = {
      refresh: readTheme,
      clear: function () { pts.length = 0; sparks.length = 0; draw(performance.now()); }
    };
  })();
</script>

</body>
</html>
