<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kamsed</title>
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">

<script>
  // 在首屏渲染前恢复主题，避免闪烁
  (function () {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark' || t === 'auto') {
      document.documentElement.dataset.theme = t;
    }
  })();
</script>

<style>
  :root {
    --bg: #fbfbfa;
    --fg: #18181a;
    --muted: #6b6b6e;
    --line: #e2e2de;
    --btn-bg: #ffffff;
    color-scheme: light;
  }

  html[data-theme="dark"] {
    --bg: #0e0e10;
    --fg: #ededeb;
    --muted: #96969a;
    --line: #26262a;
    --btn-bg: #161618;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] {
      --bg: #0e0e10;
      --fg: #ededeb;
      --muted: #96969a;
      --line: #26262a;
      --btn-bg: #161618;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 400 clamp(20px, 5vw, 30px)/1.5 -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }

  main p {
    margin: 0;
    letter-spacing: .02em;
    text-align: center;
    animation: fade .8s ease both;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 7px 16px;
    font: inherit;
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    background: var(--btn-bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: color .2s, border-color .2s, background-color .35s ease;
  }

  .theme-toggle:hover { color: var(--fg); border-color: var(--muted); }
  .theme-toggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    body { transition: none; }
    main p { animation: none; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换颜色主题">自动</button>

<main>
  <p>这里什么都没有</p>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    var modes = ['auto', 'light', 'dark'];
    var labels = { auto: '自动', light: '🔆', dark: '🌙' };

    function apply(mode) {
      root.dataset.theme = mode;
      btn.textContent = labels[mode];
      btn.setAttribute('aria-label', '切换颜色主题，当前：' + labels[mode]);
      localStorage.setItem('theme', mode);
    }

    var current = root.dataset.theme;
    if (modes.indexOf(current) === -1) current = 'auto';
    apply(current);

    btn.addEventListener('click', function () {
      var next = modes[(modes.indexOf(root.dataset.theme) + 1) % modes.length];
      apply(next);
    });
  })();
</script>

</body>
</html>
